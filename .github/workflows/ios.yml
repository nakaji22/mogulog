name: iOS Build

# Macを持たない開発環境のためのクラウドビルド。
# - push / PR: 型チェック・Lint・テスト + シミュレータ向け署名なしビルド（Appleアカウント不要で成功する）
# - workflow_dispatch で build_mode=archive を選ぶと、Secrets の証明書で署名して IPA を生成し、
#   upload=true のとき App Store Connect へアップロードする（TestFlight に届く）。

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ios.yml'
  pull_request:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'simulator=署名なし確認ビルド / archive=署名付きIPA'
        type: choice
        options: [simulator, archive]
        default: simulator
      upload:
        description: 'App Store Connectへアップロードする（archive時のみ有効）'
        type: boolean
        default: false

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Typecheck / Lint / Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate image assets
        run: npm run generate-assets
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test

  build-ios:
    name: Build iOS (${{ inputs.build_mode || 'simulator' }})
    needs: test
    runs-on: macos-latest
    env:
      BUILD_MODE: ${{ inputs.build_mode || 'simulator' }}
      UPLOAD: ${{ inputs.upload || false }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Install dependencies
        run: npm ci
      - name: Generate image assets
        run: npm run generate-assets
      - name: Expo prebuild (generate ios/ project)
        run: npx expo prebuild --platform ios --clean
      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install

      # ---------- 署名なしシミュレータビルド（デフォルト） ----------
      - name: Build for iOS Simulator (unsigned)
        if: env.BUILD_MODE == 'simulator'
        run: |
          set -euo pipefail
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(xcodebuild -list -json -workspace "$WORKSPACE" | python3 -c "import json,sys; print(json.load(sys.stdin)['workspace']['schemes'][0])")
          echo "workspace=$WORKSPACE scheme=$SCHEME"
          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO | tee build-simulator.log

      # ---------- 署名付き Archive（Apple Developer登録後） ----------
      - name: Install signing certificate and provisioning profile
        if: env.BUILD_MODE == 'archive'
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${CERTIFICATE_P12_BASE64:-}" ]; then echo "::error::Secrets APPLE_CERTIFICATE_P12_BASE64 が未設定です。docs/BUILD_IOS.md を参照してください。"; exit 1; fi
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$CERTIFICATE_P12_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/mogulog.mobileprovision"

      - name: Archive (signed)
        if: env.BUILD_MODE == 'archive'
        env:
          DEVELOPMENT_TEAM_ID: ${{ secrets.DEVELOPMENT_TEAM_ID }}
          PROVISIONING_PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
        run: |
          set -euo pipefail
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(xcodebuild -list -json -workspace "$WORKSPACE" | python3 -c "import json,sys; print(json.load(sys.stdin)['workspace']['schemes'][0])")
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/mogulog.xcarchive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROVISIONING_PROFILE_NAME" | tee build-archive.log

      - name: Export IPA
        if: env.BUILD_MODE == 'archive'
        env:
          DEVELOPMENT_TEAM_ID: ${{ secrets.DEVELOPMENT_TEAM_ID }}
          PROVISIONING_PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
        run: |
          set -euo pipefail
          sed -e "s/__TEAM_ID__/$DEVELOPMENT_TEAM_ID/g" -e "s/__PROFILE_NAME__/$PROVISIONING_PROFILE_NAME/g" ios-config/ExportOptions.plist > build/ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath build/mogulog.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist build/ExportOptions.plist | tee build-export.log
          ls -la build/ipa

      - name: Upload to App Store Connect
        if: env.BUILD_MODE == 'archive' && env.UPLOAD == 'true'
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p private_keys
          echo "$ASC_API_KEY_P8_BASE64" | base64 --decode > "private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
          IPA=$(ls build/ipa/*.ipa | head -1)
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$ASC_API_KEY_ID" --apiIssuer "$ASC_API_ISSUER_ID" | tee upload.log

      - name: Upload build artifacts (IPA and logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-${{ github.run_number }}
          path: |
            build/ipa/*.ipa
            build-*.log
            upload.log
          if-no-files-found: ignore
          retention-days: 14

